<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kojikoji81の日記</title>
    <meta name="description" content="kojikoji81の個人日記">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- メインレイアウト用テーブル -->
    <table class="main-layout" cellspacing="0" cellpadding="0">
        
        <!-- ヘッダー -->
        <tr>
            <td colspan="2" class="header-cell">
                <h1 class="site-title">kojikoji81の日記</h1>
            </td>
        </tr>

        <!-- メインコンテンツ ＆ サイドバー -->
        <tr>
            <!-- サイドバー (左側: カレンダーのみ) -->
            <td class="sidebar-cell">

                <!-- カレンダー -->
                <div class="side-box">
                    <div class="side-box-title">■ CALENDAR</div>
                    <div id="calendar-widget"></div>
                </div>

            </td>

            <!-- メインコンテンツ (右側: 動的にposts.jsonを描画) -->
            <td class="content-cell">

                <a name="top"></a>
                <!-- 動的描画用コンテナ -->
                <div id="diary-posts-container">
                    <!-- JS読み込み前のデフォルトフォールバック表示 -->
                    <div class="diary-entry">
                        <div class="entry-header">
                            <span class="entry-date-title">2026/07/25（土） 「日記を開設しました！（爆）」</span>
                            <span class="entry-tag">日記</span>
                        </div>
                        <div class="entry-body">
                            <p>ついに「kojikoji81の日記」を開設しました！！<br><s>（本当はもっと早く始めるつもりだったのは秘密爆）</s></p>
                            <p>シンプルな黒背景と1px枠線のテーブルレイアウトで、昔ながらのテキスト雰囲気にしてみました<span class="laugh">（笑）</span>。<br>これからは日常の出来事や気になったことなどを、マイペースに書き残していこうと思います。</p>
                        </div>
                    </div>
                </div>

            </td>
        </tr>

        <!-- フッター -->
        <tr>
            <td colspan="2" class="footer-cell">
                Copyright (C) 2026 kojikoji81の日記 All Rights Reserved.
            </td>
        </tr>

    </table>

    <script src="script.js"></script>
</body>
</html>
